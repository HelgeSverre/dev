[package]
name = "dev-launcher"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Zero-setup command discovery and launcher for software projects"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "dev"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
directories = "6.0"
globset = "0.4"
ignore = "0.4"
nucleo-matcher = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
smallvec = "1.15"
strsim = "0.11"
thiserror = "2.0"
toml = "0.9"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
proptest = "1.9"
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
