[package]
name = "dev-launcher"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Zero-setup command discovery and launcher for software projects"
license = "MIT OR Apache-2.0"
repository = "https://github.com/HelgeSverre/dev"
homepage = "https://github.com/HelgeSverre/dev"
publish = false

[[bin]]
name = "dev"
path = "src/main.rs"

[[bench]]
name = "performance"
harness = false

[package.metadata.dist]
dist = true
formula = "dev"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
clap_complete = "4.5"
clap_complete_nushell = "4.6"
directories = "6.0"
fs4 = { version = "1.1", features = ["sync"] }
globset = "0.4"
ignore = "=0.4.29"
nucleo-matcher = "0.3"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
smallvec = "1.15"
strsim = "0.11"
thiserror = "2.0"
toml = "1.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["process", "signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
assert_cmd = "2.0"
expectrl = "0.9"
predicates = "3.1"
proptest = "1.9"
syn = { version = "2.0", features = ["full", "visit"] }
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.dist]
inherits = "release"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
